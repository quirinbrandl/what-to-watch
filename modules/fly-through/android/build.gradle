plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.whattowatch.flythrough'
version = '1.0.0'

android {
  namespace "dev.whattowatch.flythrough"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
